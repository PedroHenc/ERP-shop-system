spring.application.name=erp-shop-system
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:shop_api}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.schemas=${DB_SCHEMA:shop_api}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:PT15M}
app.auth.refresh-ttl=${APP_AUTH_REFRESH_TTL:P7D}
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.path=${APP_AUTH_COOKIE_PATH:/auth}
# Public "create a store" sign-up. Joining a store through an invite works either way.
app.signup.enabled=${APP_SIGNUP_ENABLED:true}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
