# Test-only overrides. Kept under config/ so Spring Boot loads them ON TOP of the main
# src/main/resources/application.properties instead of replacing it (same classpath name).
spring.application.name=erp-shop-system
app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=test-secret-test-secret-test-secret-test-secret-
app.jwt.access-ttl=PT15M
app.auth.refresh-ttl=P7D
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax
app.auth.cookie.path=/auth
app.bootstrap.admin.email=
app.bootstrap.admin.password=
